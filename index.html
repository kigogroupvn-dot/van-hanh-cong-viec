<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vận hành công việc Kigo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Mona+Sans:wght@400;500;600;700&display=swap">
<style>
@font-face{font-family:"SVN Gilroy";src:url("fonts/gilroy-bold.otf") format("opentype");font-weight:700;font-display:swap}
@font-face{font-family:"SVN Gilroy";src:url("fonts/gilroy-black.otf") format("opentype");font-weight:900;font-display:swap}
@font-face{font-family:"Photograph Signature";src:url("fonts/photograph-signature.otf") format("opentype");font-display:swap}
/* Layout: internal portal. Sticky top bar (logo, nav, search) → routed views: Home (hero like the plan site, plans, due soon, people), Person page, Search. Kigo identity: white, hairlines, crimson block for figures and states. Always light. */
:root{--crimson:#AC2436;--velvet:#8E0F0B;--misty:#FDE3DD;--flamingo:#F9BAB7;--white:#FFFFFF;--text:#353535;--muted:#76696B;--grey:#C9C9C9;--rule:#EAD7D2;--paper:#FBF7F6;
--f-title:"Philosopher",Georgia,serif;--f-head:"SVN Gilroy","Mona Sans",system-ui,sans-serif;--f-body:"Mona Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-script:"Photograph Signature","Brush Script MT",cursive;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{overflow-x:clip;margin:0;background:var(--white);color:var(--text);font-family:var(--f-body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--white)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
@media(min-width:900px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
a{color:inherit}
:focus-visible{outline:3px solid var(--flamingo);outline-offset:2px}
.kicker{font-family:var(--f-head);font-weight:700;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--crimson)}
h1,h2,h3{font-family:var(--f-title);font-weight:700;color:var(--velvet);margin:0;text-wrap:balance;line-height:1.1}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:28px;height:68px}
.top .logo{width:96px;color:var(--crimson);display:block;flex:none}
.top nav{display:flex;gap:4px}
.top nav a{white-space:nowrap;text-decoration:none;font-size:14.5px;font-weight:500;padding:8px 12px;border-radius:6px;color:var(--muted)}
.top nav a:hover{color:var(--text);background:var(--paper)}
.top nav a[aria-current="page"]{color:var(--velvet);background:var(--misty);font-weight:600}
.search{margin-left:auto;position:relative;flex:0 1 280px;min-width:0}
.search input{width:100%;font:inherit;font-size:14px;border:1px solid var(--rule);border-radius:8px;padding:9px 12px 9px 34px;background:var(--paper);color:var(--text)}
.search input:focus{outline:none;border-color:var(--crimson);background:var(--white)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}

main{padding-block:48px 80px;min-height:70vh}
.crumbs{font-size:13.5px;color:var(--muted);margin-bottom:18px}.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--crimson)}
.pagehead{display:grid;gap:10px;margin-bottom:40px;max-width:820px}
.pagehead h1{font-size:clamp(34px,4.4vw,54px)}
.pagehead p{margin:0;color:var(--muted);font-size:17px}
.sample{justify-self:start;display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px dashed var(--flamingo);color:var(--velvet);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px}
.blockhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:56px 0 18px;border-bottom:1.5px solid var(--velvet);padding-bottom:12px}
.blockhead h2{font-size:28px}
.blockhead a{font-size:14px;font-weight:600;color:var(--crimson);text-decoration:none;white-space:nowrap}

/* home hero (same language as the plan site) */
main{position:relative}
body.home main,body.sub main{padding-top:0}
/* full-bleed band helper */
.bleed{position:relative}
.bleed::before{content:"";position:absolute;inset:0 calc(50% - 50vw);z-index:-1}
/* E — home hero: full-bleed brand photo with crimson veil, nav floats over it */
.heroE{color:var(--white);padding-block:150px 96px;min-height:620px;display:flex;align-items:center}
.heroE::before{background:#f6b9bd url("hero-rose7.jpg") right center/cover no-repeat}
.heroE::after{content:"";position:absolute;inset:0 calc(50% - 50vw);z-index:-1;background:linear-gradient(90deg,rgba(110,12,22,.94) 0%,rgba(142,15,11,.84) 30%,rgba(172,36,54,.3) 48%,rgba(172,36,54,0) 62%)}
.heroE .inner{max-width:560px;position:relative;z-index:1}
.heroE .hlogo{position:absolute;right:0;top:50%;transform:translateY(-44%);width:min(440px,34vw);color:#fff;z-index:0;pointer-events:none}
@media(max-width:900px){.heroE .hlogo{display:none}}
.heroE .kicker{color:var(--flamingo);letter-spacing:.32em}
.heroE h1{color:var(--white);font-size:clamp(44px,5.2vw,74px);line-height:1.02;margin-top:22px;letter-spacing:-.01em}
.heroE h1 em{display:block;font-style:italic;font-weight:400;color:var(--flamingo)}
.heroE dl{display:grid;grid-template-columns:120px 1fr;gap:12px 24px;margin:36px 0 0;font-size:16.5px}
.heroE dt{font-family:var(--f-head);font-weight:700;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--flamingo);padding-top:5px}
.heroE dd{margin:0;color:rgba(255,255,255,.92);line-height:1.55}
body.home .top{position:absolute;left:0;right:0;background:transparent;border-bottom-color:rgba(255,255,255,.18);backdrop-filter:none}
body.home .top .logo{color:var(--white)}
body.home .top nav a{color:rgba(255,255,255,.78)}body.home .top nav a:hover{background:rgba(255,255,255,.1);color:var(--white)}
body.home .top nav a[aria-current="page"]{background:none;color:var(--white);border-bottom:2px solid var(--flamingo);border-radius:0}
body.home .search input{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.45);color:var(--white)}
body.home .search input::placeholder{color:rgba(255,255,255,.75)}body.home .search svg{color:rgba(255,255,255,.8)}
body.home::before{background:transparent}
.bandE{padding-block:28px 8px;color:var(--text)}
.bandE::before{background:var(--white)}
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.boxes div{border-left:1px solid var(--rule);padding:20px 24px;display:flex;align-items:baseline;gap:12px;min-width:0}.boxes div:first-child{border-left:none;padding-left:0}
.boxes b{font-family:var(--f-title);font-weight:400;font-size:52px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--crimson)}
.boxes span{font-size:15px;color:var(--muted)}
.bandE small{display:block;margin-top:14px;font-size:13px;color:var(--muted)}
/* D — sub-page header band */
.bandD{color:var(--white);padding-block:28px 0;margin-bottom:40px}
.bandD::before{background:var(--crimson);bottom:56px}
.bandD .ring{position:absolute;border:1.5px solid rgba(255,255,255,.16);border-radius:50%;pointer-events:none;z-index:-1}
.bandD .crumbs{color:var(--misty)}.bandD .crumbs a:hover{color:var(--white)}
.bandD .kicker{color:var(--flamingo)}
.bandD .who{display:flex;gap:22px;align-items:center;margin-top:20px}
.bandD .who .av{width:72px;height:90px;font-size:26px;background:var(--white)}
.bandD h1{color:var(--white);font-size:clamp(40px,5vw,64px);margin-top:8px}
.bandD p{margin:6px 0 0;color:var(--misty);font-size:16px}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--white);color:var(--text);border-radius:20px 20px 0 0;padding:24px 32px 18px;margin-top:32px;box-shadow:0 -1px 0 var(--rule)}
.dstats div{padding:4px 0 4px 24px;border-left:1px solid var(--rule)}.dstats div:first-child{border-left:none;padding-left:0}
.dstats b{display:block;font-family:var(--f-head);font-weight:900;font-size:40px;line-height:1;color:var(--crimson);font-variant-numeric:tabular-nums}
.dstats span{font-size:13.5px;color:var(--muted)}
/* home */
.home-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:end}
.home-hero .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.home-hero .stats div{padding:18px 0 18px 20px;border-left:1px solid var(--rule)}.home-hero .stats div:first-child{border-left:none;padding-left:0}
.home-hero .stats b{display:block;font-family:var(--f-head);font-weight:900;font-size:40px;line-height:1;color:var(--crimson);font-variant-numeric:tabular-nums}
.home-hero .stats span{font-size:13.5px;color:var(--muted)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.plan{border:1px solid var(--rule);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;text-decoration:none;min-width:0;transition:border-color .15s}
a.plan:hover{border-color:var(--crimson)}
.plan.lead{background:var(--crimson);border-color:var(--crimson);color:var(--white);border-radius:90px 14px 14px 14px;padding-top:40px}
.plan.lead h3{color:var(--white)}.plan.lead .kicker{color:var(--flamingo)}.plan.lead p{color:var(--misty)}
.plan h3{font-size:25px}
.plan p{margin:0;font-size:14.5px;color:var(--muted)}
.plan .meta{display:flex;gap:18px;margin-top:auto;padding-top:14px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
.plan.lead .meta{border-top-color:rgba(255,255,255,.25);color:var(--misty)}
.plan .meta b{display:block;font-family:var(--f-head);font-weight:900;font-size:22px;color:var(--crimson)}
.plan.lead .meta b{color:var(--white)}
.plan.draft{border-style:dashed}
.plan.add{border-style:dashed;align-items:flex-start;justify-content:center;color:var(--muted);background:var(--paper)}
.plan.add b{font-family:var(--f-title);font-size:22px;color:var(--velvet)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:48px}
.due{list-style:none;margin:0;padding:0}
.due li{display:grid;grid-template-columns:76px 1fr auto;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule)}
.due .d{font-family:var(--f-head);font-weight:900;font-size:24px;color:var(--crimson);line-height:1;font-variant-numeric:tabular-nums}
.due .d small{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:4px;font-weight:700}
.due b{display:block;font-weight:600}.due span{font-size:13.5px;color:var(--muted)}
.people{display:grid;gap:0}
.person{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.person:hover b{color:var(--crimson)}
.av{display:inline-grid;place-items:center;width:34px;height:42px;border-radius:50%;background:var(--misty);color:var(--crimson);font-family:var(--f-head);font-weight:900;font-size:13px;flex:none}
.person b{display:block;font-family:var(--f-title);font-size:20px;color:var(--velvet)}
.person small{color:var(--muted);font-size:13px}
.person .n{text-align:right;font-size:13px;color:var(--muted)}.person .n strong{display:block;font-family:var(--f-head);font-weight:900;font-size:22px;color:var(--crimson)}

/* plans */
.plan{position:relative}
.plan .smp{position:absolute;top:14px;right:14px;font-size:11px;font-weight:600;color:var(--muted);border:1px dashed var(--flamingo);border-radius:999px;padding:2px 8px;background:var(--white)}
.plan.nm{border-top:3px solid #C2652A}
.plans{grid-template-columns:repeat(3,1fr)}
.d.att0{color:var(--crimson)}.d.att1{color:var(--velvet)}.d.att2{color:var(--crimson)}
.tasks small.warn{color:var(--crimson);font-weight:600}
.tasks td a{color:var(--velvet);font-weight:600;text-decoration:none}
.planbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.pbtn{font-family:var(--f-head);font-weight:700;font-size:13px;letter-spacing:.04em;padding:9px 16px;border:1px solid rgba(255,255,255,.75);color:var(--white);text-decoration:none;border-radius:6px}
.pbtn:hover{background:rgba(255,255,255,.12)}
.pbtn.ghost{opacity:.75}
/* workload + report */
.load{margin:8px 0 8px;display:grid;gap:12px}
.lrow{display:grid;grid-template-columns:180px 1fr 90px;gap:16px;align-items:center}
.lrow b{font-family:var(--f-title);font-size:18px;color:var(--velvet)}
.lrow small{display:block;font-size:12.5px;color:var(--muted)}
.ltrack{height:18px;background:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 10%);position:relative}
.ltrack i{position:absolute;left:0;top:0;bottom:0;background:var(--crimson)}
.ltrack i.r{background:var(--flamingo)}
.lrow .v{font-family:var(--f-head);font-weight:900;font-size:20px;color:var(--crimson);text-align:right;white-space:nowrap}
.rgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;margin-top:8px}
.kpirow{display:grid;grid-template-columns:110px 1fr 70px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.kpirow .bar{height:10px;background:var(--misty);position:relative}.kpirow .bar i{position:absolute;inset:0 auto 0 0;background:var(--crimson)}
.kpirow .v{font-family:var(--f-head);font-weight:700;text-align:right;white-space:nowrap}
.rlist{list-style:none;margin:0;padding:0}.rlist li{padding:12px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.rlist li b{display:block;font-weight:600}.rlist li span{font-size:13px;color:var(--muted)}
.smpnote{display:inline-block;font-size:12.5px;font-weight:600;color:var(--velvet);border:1px dashed var(--flamingo);border-radius:999px;padding:4px 12px;margin-top:6px}
@media(max-width:900px){.lrow{grid-template-columns:110px 1fr 60px}.rgrid{grid-template-columns:1fr}}
/* sales */
.gate{max-width:440px;margin:24px auto 40px;border:1px solid var(--rule);border-radius:16px;padding:32px;display:grid;gap:14px;text-align:center}
.gate h3{font-family:var(--f-title);font-size:24px;color:var(--velvet);margin:0}
.gate p{margin:0;color:var(--muted);font-size:14.5px}
.gate input{font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;text-align:center}
.gate input:focus{outline:none;border-color:var(--crimson)}
.gate button,.sbtn{font-family:var(--f-head);font-weight:700;font-size:14px;letter-spacing:.04em;background:var(--crimson);color:#fff;border:none;border-radius:10px;padding:12px 18px;cursor:pointer}
.gate .err{color:var(--crimson);font-weight:600;min-height:1.2em}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.prod{border:1px solid var(--rule);border-radius:16px;padding:22px 24px;display:grid;gap:14px}
.prod h3{font-family:var(--f-title);font-size:24px;color:var(--velvet);margin:0}
.prod .row3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule)}
.prod .row3 div{padding:12px 0 0 14px;border-left:1px solid var(--rule)}.prod .row3 div:first-child{border-left:none;padding-left:0}
.prod .row3 b{display:block;font-family:var(--f-head);font-weight:900;font-size:22px;color:var(--crimson);white-space:nowrap}
.prod .row3 span{font-size:12.5px;color:var(--muted)}
.prod .empty{color:var(--muted);font-size:14px}
.ratio.bad{color:var(--crimson)!important}.ratio.ok{color:var(--velvet)!important}
.chart{border:1px solid var(--rule);border-radius:16px;padding:22px 24px;margin-top:18px}
.chart .lg{display:flex;gap:18px;font-size:13px;color:var(--muted);margin-bottom:10px}
.chart .lg i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px}
.cbars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:220px;border-bottom:1px solid var(--velvet);padding-top:10px}
.cday{display:flex;gap:2px;align-items:end;height:100%;justify-content:center;position:relative}
.cday i{display:block;width:42%;max-width:14px;border-radius:2px 2px 0 0}
.cday i.c{background:var(--flamingo)}.cday i.r{background:var(--crimson)}
.cdates{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;font-size:10.5px;color:var(--muted);text-align:center;margin-top:6px;font-variant-numeric:tabular-nums}
.stable td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.stable th.num{text-align:right}
.snote{font-size:13px;color:var(--muted);margin:14px 0 0}
@media(max-width:900px){.prods{grid-template-columns:1fr}.cdates span:nth-child(even){visibility:hidden}}
.dstats.sk b{font-size:30px;white-space:nowrap}
@media(max-width:900px){.dstats.sk{grid-template-columns:1fr}.dstats.sk div{border-left:none!important;padding:10px 0!important;border-top:1px solid var(--rule)}.dstats.sk div:first-child{border-top:none}.dstats.sk b{font-size:24px}}
.stable .n,.dtable .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tasks th.n{text-align:right}
td.z{color:#bbb}.bad{color:var(--crimson)!important;font-weight:700}.good{color:#1d7a46!important;font-weight:700}
tr.tot td{font-weight:700;background:var(--misty);border-top:1.5px solid var(--velvet)}
.dwrap{overflow-x:auto}
.dtable{width:100%;min-width:980px;border-collapse:collapse;font-size:14px}
.dtable th{font-family:var(--f-head);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 10px;border-bottom:1.5px solid var(--velvet);text-align:left}
.dtable td{padding:10px;border-bottom:1px solid var(--rule)}
.dtable .gs{border-left:14px solid #fff;box-shadow:inset 1px 0 0 var(--rule)}
.dtable tr.gh th{border-bottom:none;padding:0 0 8px}
.dtable tr.gh th span{display:block;background:var(--crimson);color:#fff;font-size:12.5px;letter-spacing:.18em;text-align:center;padding:8px;border-radius:8px 8px 0 0}
.dtable tr.gh th.gt span{background:var(--velvet)}
.dtable col.gtot{background:var(--paper)}
.dtable td.ch{font-family:var(--f-title);font-weight:700;color:var(--velvet)}
/* edit mode */
body.editing [data-ed]{outline:1.5px dashed var(--flamingo);outline-offset:2px;cursor:text;border-radius:2px}
body.editing [data-ed]:hover{outline-color:var(--crimson)}
body.editing [data-ed]:focus{outline:2px solid var(--crimson);background:rgba(253,227,221,.55)}
body.editing [data-ed].changed{outline:2px solid #1d7a46}
.edbar{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:grid;gap:10px;justify-items:end;width:min(380px,calc(100vw - 32px))}
.edpanel{background:#fff;border:1px solid var(--rule);border-radius:12px;box-shadow:0 12px 40px rgba(80,20,20,.18);padding:16px;display:grid;gap:10px;width:100%}
.edpanel b{font-family:var(--f-head);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--crimson)}
.edpanel p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.edpanel textarea{font:inherit;font-size:14px;min-height:88px;resize:vertical;border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
.edrow{display:flex;gap:10px;align-items:center;justify-content:space-between}.edrow span{font-size:12.5px;color:var(--muted)}
.edbtn{font-family:var(--f-head);font-weight:700;font-size:13px;border:none;border-radius:8px;padding:11px 18px;cursor:pointer;background:var(--crimson);color:#fff;box-shadow:0 6px 20px rgba(172,36,54,.3)}
.edbtn:disabled{background:var(--grey);box-shadow:none;cursor:default}.edbtn.alt{background:var(--velvet)}
/* weekly */
.wbar{display:block;height:8px;background:var(--misty);border-radius:99px;overflow:hidden;min-width:120px}.wbar i{display:block;height:100%;background:var(--crimson)}
.wtable td small{display:block}.lk{color:var(--crimson);font-weight:600;text-decoration:none;margin-right:8px;word-break:break-all}.lk:hover{text-decoration:underline}
.wklab{font-size:13px;color:var(--muted)}td.n.bad{color:var(--crimson)}.z{color:#aaa}
/* attention */
.attn{display:grid;gap:18px}
.agrp{border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.ahead{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--rule)}
.ahead b{font-family:var(--f-head);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--velvet)}
.ahead span{font-family:var(--f-head);font-weight:900;font-size:13px;color:#fff;background:var(--crimson);border-radius:99px;min-width:24px;text-align:center;padding:2px 8px}
.a-soon .ahead span{background:var(--velvet)}.a-note .ahead span,.a-slow .ahead span{background:var(--muted)}
.a-late{border-color:var(--flamingo)}.a-late .ahead{background:var(--misty)}
.arow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--rule)}
.arow:first-of-type{border-top:none}
.arow b{display:block;font-weight:600;font-size:15px}.arow span{font-size:13px;color:var(--muted)}
.aright{text-align:right;white-space:nowrap}.aright strong{display:block;font-size:14px;color:var(--velvet)}.aright small{font-size:12px;color:var(--muted)}
.a-late .aright strong{color:var(--crimson)}
.anote{margin:0;padding:8px 16px 0;font-size:12.5px;color:var(--muted)}
/* assignment by person */
.pgroup{margin-top:44px}
.pgroup:first-of-type{margin-top:8px}
.pghead{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding-bottom:14px;border-bottom:1.5px solid var(--velvet);text-decoration:none}
.pghead .av{width:44px;height:54px;font-size:15px}
.pghead b{display:block;font-family:var(--f-title);font-size:28px;color:var(--velvet);line-height:1.1}
.pghead small{color:var(--muted);font-size:13.5px}
.pghead .nums{margin-left:auto;display:flex;gap:24px;font-size:13px;color:var(--muted)}
.pghead .nums strong{font-family:var(--f-head);font-weight:900;font-size:22px;color:var(--crimson);margin-right:6px}
.pghead:hover b{color:var(--crimson)}
.pgroup .tasks th{border-bottom:1px solid var(--rule);padding-top:12px}
/* board */
.boardwrap{overflow-x:auto;padding-bottom:8px}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}@media(max-width:1100px){.board{grid-template-columns:repeat(5,230px)}}
.col{background:var(--paper);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.colhead{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:6px 4px 12px;border-bottom:1px solid var(--rule);text-decoration:none}
.colhead b{font-family:var(--f-title);font-size:21px;color:var(--velvet);line-height:1.1}
.colhead small{grid-column:2;font-size:12.5px;color:var(--muted);margin-top:-2px}
.colhead .av{grid-row:1/span 2}
.colhead:hover b{color:var(--crimson)}
.colstats{display:flex;gap:16px;font-size:12.5px;color:var(--muted);padding:0 4px}
.colstats strong{font-family:var(--f-head);font-weight:900;font-size:18px;color:var(--crimson);margin-right:4px}
.tcard{background:var(--white);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.tcard h4{margin:0;font-family:var(--f-title);font-size:16.5px;color:var(--velvet);line-height:1.2}
.tcard p{margin:0;font-size:13.5px;line-height:1.45}
.tcard .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tcard.due{border-left:3px solid var(--crimson)}
/* status */
.st{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--velvet);white-space:nowrap}
.st::before{content:"";width:10px;height:10px;border-radius:50%;box-sizing:border-box;flex:none}
.st.due::before{background:var(--crimson)}
.st.run::before{border:2px solid var(--crimson);background:linear-gradient(90deg,var(--crimson) 50%,transparent 50%)}
.st.hold{color:var(--muted)}.st.hold::before{border:2px solid var(--grey)}
.st.done::before{background:var(--velvet)}

/* person page */
.phead{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;margin-bottom:36px}
.phead .av{width:72px;height:90px;font-size:26px}
.phead h1{font-size:clamp(36px,4.4vw,52px)}
.phead p{margin:6px 0 0;color:var(--muted)}
.pstats{display:flex;gap:0;background:var(--crimson);color:var(--white);border-radius:60px 14px 14px 14px;padding:10px 10px 10px 26px}
.pstats div{padding:14px 22px;border-left:1px solid rgba(255,255,255,.25)}.pstats div:first-child{border-left:none}
.pstats b{display:block;font-family:var(--f-head);font-weight:900;font-size:34px;color:var(--white);line-height:1}
.pstats span{font-size:12.5px;color:var(--misty)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--rule);background:var(--white);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip:hover{border-color:var(--flamingo)}
.chip[aria-pressed="true"]{background:var(--velvet);border-color:var(--velvet);color:var(--white)}
.tasks{width:100%;border-collapse:collapse;font-size:15px}
.tasks th{font-family:var(--f-head);font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:14px 16px 12px 0;border-bottom:1.5px solid var(--velvet)}
.tasks td{padding:16px 16px 16px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.tasks td.ch{font-family:var(--f-title);font-weight:700;font-size:18px;color:var(--velvet);white-space:nowrap}
.tasks td small{display:block;color:var(--muted);font-size:13.5px}
.tasks td.plan-c{font-size:13px;color:var(--muted);white-space:nowrap}
.tasks td.fig{font-family:var(--f-head);font-weight:700;white-space:nowrap}
.empty{padding:28px 0;color:var(--muted)}

/* search */
.results .r{display:grid;grid-template-columns:1fr auto;gap:6px 20px;padding:18px 0;border-bottom:1px solid var(--rule)}
.results .r b{font-family:var(--f-title);font-size:20px;color:var(--velvet)}
.results .r p{margin:0;grid-column:1;color:var(--text)}
.results .r small{grid-column:1;color:var(--muted);font-size:13px}
.results .r .st{grid-row:1;grid-column:2}
mark{background:var(--misty);color:inherit;padding:0 2px;border-radius:2px}

footer .wrap{border-top:1px solid var(--rule);padding-block:28px 40px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media(max-width:900px){
  .bandD .ring{display:none}.dstats{padding:18px 18px 14px}.dstats b{font-size:30px}.dstats div{padding-left:14px}
  .heroE{padding-block:170px 44px;min-height:0}.heroE::before{background-position:70% center}.heroE::after{background:linear-gradient(180deg,rgba(84,10,18,.45),rgba(142,15,11,.93) 52%)}.heroE dl{grid-template-columns:92px 1fr;font-size:15px}
  .boxes{grid-template-columns:1fr 1fr}.boxes div{padding:14px 12px;flex-wrap:wrap;gap:4px 10px;border-top:1px solid var(--rule)}.boxes div:nth-child(odd){border-left:none;padding-left:0}.boxes b{font-size:36px}
  .top .wrap{height:auto;flex-wrap:wrap;padding-block:10px;gap:10px 16px}
  .top nav{order:3;width:100%;overflow-x:auto}
  .search{flex:1 1 160px}
  main{padding-block:32px 56px}
  .home-hero,.two{grid-template-columns:1fr;gap:28px}
  .plans{grid-template-columns:1fr}
  .phead{grid-template-columns:auto 1fr}.pstats{grid-column:1/-1}
  .tasks thead{display:none}.tasks,.tasks tbody,.tasks tr,.tasks td{display:block}
  .tasks tr{padding:12px 0;border-bottom:1px solid var(--rule)}.tasks td{border:none;padding:3px 0}
}
</style>

</head>

      const tm=/^tab:\s*(.+)$/i.exec(src), ext=sheetId(src);
      const readTasks=async(fid,name)=>(await tab(fid,name,["Việc","Phụ trách"])).forEach(t=>{const st=ST_MAP[col(t,"Tình trạng").toLowerCase()]||"run";const tg=+col(t,"Chỉ tiêu (số)")||0,dn=col(t,"Đã làm");
        tasks.push({p:p.id,ch:col(t,"Kênh"),t:col(t,"Việc"),s:col(t,"Mô tả thêm"),who:who(col(t,"Phụ trách")),st,due:col(t,"Hạn"),goal:dn!==""&&tg?dn+"/"+tg:col(t,"Chỉ tiêu"),n:col(t,"Ghi chú"),links:links(col(t,"Link bài"))})});
      try{ if(tm) await readTasks(id,tm[1].trim()); else if(ext) await readTasks(ext,"Việc"); }catch(e){}
      if(ext){ try{ const posts=await tab(ext,"Bài đăng",["Ngày","Link bài đã đăng"]); const k=who(col(r,"Người đăng bài")||p.owner)[0]; const g={};
        posts.forEach(x=>{const d=dd(col(x,"Ngày"));if(!d)return;const wk=wkKey(monday(d));const o=g[wk]=g[wk]||{wk,id:p.id,ch:"Fanpage "+(p.brand||p.name),who:k,target:0,done:0,links:[],src:"Sheet "+(p.brand||p.name)};o.target++;o.dates=(o.dates||[]);o.dates.push(fmtD(d));o.dueNow=(o.dueNow||0)+(d<=TODAY?1:0);const L=links(col(x,"Link bài đã đăng"));if(L.length||/đã đăng/i.test(col(x,"Tình trạng")))o.done++;o.links.push(...L)});
        weeks.push(...Object.values(g)); p.count=posts.length;
        if(k&&!tasks.some(t=>t.p===p.id)){const c=g[CUR_WK],nx=Object.values(g).filter(w=>dd(w.wk)>=monday(TODAY)).length;
          tasks.push({p:p.id,ch:"Fanpage "+(p.brand||p.name),t:"Đăng bài theo lịch content ("+posts.length+" bài)",s:c?("Tuần này "+c.done+"/"+c.target+" bài"):(nx?"Tuần này không có bài theo lịch":"Đã hết lịch đăng"),who:[k],st:"run",links:[]});} }catch(e){} }
    }
    try{ (await tab(id,"Tiến độ tuần",["Tuần","Đã đăng"])).forEach(w=>{const d=dd(col(w,"Tuần"));if(!d)return;weeks.push({wk:wkKey(monday(d)),id:col(w,"Mã việc"),ch:col(w,"Kênh"),who:who(col(w,"Phụ trách"))[0],target:+col(w,"Chỉ tiêu")||0,done:col(w,"Đã đăng")===""?0:+col(w,"Đã đăng")||0,links:links(col(w,"Link bài")),n:/^VÍ DỤ/i.test(col(w,"Ghi chú"))?"":col(w,"Ghi chú")})}) }catch(e){}
    PEOPLE=people; PLANS=plans; TASKS=tasks; WEEKS=weeks; DEMO=false;
    const now=new Date(); SOURCE_NOTE="Dữ liệu cập nhật lúc "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+" "+fmtD(now)+"/"+now.getFullYear();
    const u=document.getElementById("upd"); if(u)u.textContent=SOURCE_NOTE;
    route();
  }catch(e){ SOURCE_NOTE="Chưa đọc được Google Sheets, đang hiện dữ liệu demo"; route(); }
}
loadAll();
</script>
